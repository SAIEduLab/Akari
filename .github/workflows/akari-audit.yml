name: Akari audit
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  AKARI_REQUESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
concurrency:
  group: akari-audit-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lane-plan:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      lanes: ${{ steps.plan.outputs.lanes }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - id: plan
        run: node audit/lib/ci-lanes.mjs plan audit
  audit-lane:
    needs: [lane-plan]
    if: ${{ always() && needs.lane-plan.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.lane-plan.outputs.lanes) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          npm install --prefix "$RUNNER_TEMP/audit-deps" --no-package-lock --no-audit --no-fund playwright@1.55.0 jsdom@26.1.0 @babel/parser@7.28.4 mdast-util-from-markdown@2.0.2 micromark@4.0.3 parse5@7.3.0 eslint@10.13.0 eslint-plugin-unicorn@79.0.0 eslint-plugin-sonarjs@4.2.2 globals@17.14.0 typescript@6.0.3
          node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV,"NODE_PATH="+require("path").join(process.env.RUNNER_TEMP,"audit-deps/node_modules")+"\n")'
          "$RUNNER_TEMP/audit-deps/node_modules/.bin/playwright" install --no-shell chromium
          python -m pip install Pillow imageio-ffmpeg==0.6.0
          python audit/install-codec-browser.py "$RUNNER_TEMP/functional-browser" --media
          echo "AKARI_PYTHON=python" >> "$GITHUB_ENV"
      - run: node audit/run-ci-lane.mjs audit "${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akari-audit-lane-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-evidence/ci-lane/
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true
  aggregate:
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [lane-plan, audit-lane]
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - name: Install the audit packages in runner temporary storage
        run: |
          npm install --prefix "$RUNNER_TEMP/audit-deps" --no-package-lock --no-audit --no-fund playwright@1.55.0 @babel/parser@7.28.4 mdast-util-from-markdown@2.0.2 micromark@4.0.3 parse5@7.3.0
          node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV,"NODE_PATH="+require("path").join(process.env.RUNNER_TEMP,"audit-deps/node_modules")+"\n")'
      - uses: actions/download-artifact@v4
        with:
          # Partial reruns retain earlier jobs; validate each kind's newest attempt.
          pattern: akari-*-${{ github.run_id }}-*
          path: downloaded-evidence
      - run: node audit/lib/ci-lanes.mjs unpack audit downloaded-evidence
      - run: node audit/verify-evidence.mjs aggregate downloaded-evidence audit-evidence/aggregate.json
        env:
          AKARI_NEEDS: ${{ toJSON(needs) }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akari-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            audit-evidence/aggregate.json
            audit-evidence/merged/selftest/gate.json
            audit-evidence/merged/selftest/entry-browser.json
            audit-evidence/merged/selftest/entry-verify.json
            audit-evidence/merged/selftest/entry-verify.log
            audit-evidence/merged/full-browser/summary.json
            audit-evidence/merged/full-browser/candidate/browser-schemas.json
            audit-evidence/merged/full-browser/candidate/modern-browser.json
          if-no-files-found: error
          retention-days: 3
