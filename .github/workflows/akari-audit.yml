name: Akari audit
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  AKARI_REQUESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
concurrency:
  group: akari-audit-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  selftest:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm install --prefix "$RUNNER_TEMP/audit-deps" --no-package-lock --no-audit --no-fund playwright@1.55.0 jsdom@26.1.0 @babel/parser@7.28.4
          node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV,"NODE_PATH="+require("path").join(process.env.RUNNER_TEMP,"audit-deps/node_modules")+"\n")'
          "$RUNNER_TEMP/audit-deps/node_modules/.bin/playwright" install --no-shell chromium
          python audit/install-codec-browser.py "$RUNNER_TEMP/functional-browser"
      - run: node audit/run-local-gate.mjs "$AKARI_BROWSER" audit-evidence/selftest
      - run: node audit/verify-evidence.mjs seal selftest audit-evidence/selftest
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akari-selftest-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-evidence/selftest/
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true
  full-browser-gate:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        group: [session, ui, limits, schemas, extra]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          npm install --prefix "$RUNNER_TEMP/audit-deps" --no-package-lock --no-audit --no-fund playwright@1.55.0 @babel/parser@7.28.4
          node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV,"NODE_PATH="+require("path").join(process.env.RUNNER_TEMP,"audit-deps/node_modules")+"\n")'
          "$RUNNER_TEMP/audit-deps/node_modules/.bin/playwright" install --no-shell chromium
          python -m pip install Pillow imageio-ffmpeg==0.6.0
          python audit/install-codec-browser.py "$RUNNER_TEMP/functional-browser" --media
          echo "AKARI_PYTHON=python" >> "$GITHUB_ENV"
      - run: node audit/browser/run-full-browser-audit.mjs --group "${{ matrix.group }}" --evidence "audit-evidence/full-browser-${{ matrix.group }}"
      - run: node audit/verify-evidence.mjs seal "full-browser-${{ matrix.group }}" "audit-evidence/full-browser-${{ matrix.group }}"
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akari-full-browser-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-evidence/full-browser-${{ matrix.group }}/
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true
  audio-codecs:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          npm install --prefix "$RUNNER_TEMP/audit-deps" --no-package-lock --no-audit --no-fund playwright@1.55.0
          node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV,"NODE_PATH="+require("path").join(process.env.RUNNER_TEMP,"audit-deps/node_modules")+"\n")'
          python audit/install-codec-browser.py "$RUNNER_TEMP/codec-browser"
      - run: node audit/tests/audio-codecs.mjs "$AKARI_CODEC_BROWSER" audit-evidence/audio/report.json
      - run: node audit/tests/block-field-width.mjs "$AKARI_CODEC_BROWSER" audit-evidence/audio/block-field-width.json
      - run: node audit/verify-evidence.mjs seal audio-codecs-win32 audit-evidence/audio
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akari-audio-codecs-win32-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-evidence/audio/
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true
  aggregate:
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [selftest, full-browser-gate, audio-codecs]
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          # Partial reruns retain earlier jobs; validate each kind's newest attempt.
          pattern: akari-*-${{ github.run_id }}-*
          path: downloaded-evidence
      - run: node audit/verify-evidence.mjs aggregate downloaded-evidence audit-evidence/aggregate.json
        env:
          AKARI_NEEDS: ${{ toJSON(needs) }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akari-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-evidence/aggregate.json
          if-no-files-found: error
          retention-days: 3
