name: Akari change guard
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: [.github/workflows/akari-change-guard.yml]
permissions:
  contents: read
concurrency:
  group: akari-change-guard-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ startsWith(github.event_name, 'pull_request') }}
jobs:
  audit-change-guard:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.2'
      - run: |
          npm install --prefix "$RUNNER_TEMP/audit-deps" --no-package-lock --no-audit --ignore-scripts --no-fund playwright@latest @babel/parser@7.28.4 @babel/types@7.29.11 @babel/helper-string-parser@7.29.13 @babel/helper-validator-identifier@7.29.7
          node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV,"NODE_PATH="+require("path").join(process.env.RUNNER_TEMP,"audit-deps/node_modules")+"\n")'
      - name: Use the guard of the base with the tests and fixtures of the head
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          AKARI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git checkout "$AKARI_BASE_SHA" -- audit/lib audit/tests audit/browser/cases/audit-lib.cjs
      - name: Check the change and list what the owner reads before the merge
        env:
          AKARI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AKARI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node audit/tests/change-guard.mjs "$AKARI_BASE_SHA" "$AKARI_HEAD_SHA" audit-evidence/change-guard/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: akari-change-guard-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-evidence/change-guard/
          if-no-files-found: error
          retention-days: 3
