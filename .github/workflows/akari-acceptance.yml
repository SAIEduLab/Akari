name: Akari fixed acceptance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: akari-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  composition-acceptance:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    # Attempt 2 completed every check and upload in 16m17s; keep test limits intact.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the approved fixed browser in runner temporary storage
        run: |
          npm install --prefix "$RUNNER_TEMP/audit-deps" --no-package-lock --no-audit --no-fund playwright@1.55.0
          echo "NODE_PATH=$RUNNER_TEMP/audit-deps/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/audit-deps/node_modules/.bin/playwright" install-deps chromium
          python audit/install-codec-browser.py "$RUNNER_TEMP/acceptance-browser"
      - name: Map the original fixed plan and verify the Q76 values
        run: |
          mkdir -p audit-evidence/acceptance
          node audit/tests/actions-transfer-static.mjs audit-evidence/acceptance/transfer.json
          node audit/tests/actions-transfer-values.mjs audit-evidence/acceptance/values.json
          node audit/tests/command-meaning.mjs audit-evidence/acceptance/command-meaning.json
      - name: Verify original basic intentions and separate continuous rates
        run: node audit/tests/basic-intents.mjs audit-evidence/acceptance/basic-intents.json
      - name: Verify finite semantic variants and minimum-pair refusals
        run: |
          node audit/tests/finite-semantic-variants.mjs audit-evidence/acceptance/finite-semantic-variants.json
          node audit/tests/semantic-negative-pairs.mjs audit-evidence/acceptance/semantic-negative-pairs.json
      - name: Verify natural role variants and atomic clone rejection
        run: node audit/tests/natural-roles.mjs audit-evidence/acceptance/natural-roles.json
      - name: Verify document units, source ownership and multiline editing
        run: node audit/tests/document-units.mjs audit-evidence/acceptance/document-units.json
      - name: Verify unfinished project files and structural rejection
        run: node audit/tests/draft-persistence.mjs audit-evidence/acceptance/draft-persistence.json
      - name: Verify declared units and list form values
        run: node audit/tests/data-form-values.mjs audit-evidence/acceptance/data-form-values.json
      - name: Verify display precision without changing values
        run: node audit/tests/numeric-display.mjs audit-evidence/acceptance/numeric-display.json
      - name: Verify resource references and atomic renames
        run: node audit/tests/resource-references.mjs audit-evidence/acceptance/resource-references.json
      - name: Verify intent search and typed name bindings
        run: node audit/tests/search-bindings.mjs audit-evidence/acceptance/search-bindings.json
      - name: Enter original basic intentions and exercise native input and saving
        if: always()
        run: node audit/tests/basic-intents-browser.mjs "$AKARI_CODEC_BROWSER" audit-evidence/acceptance/basic-intents-browser.json
      - name: Record actual WebAudio output and verify sound command semantics
        if: always()
        run: node audit/tests/audio-output-browser.mjs "$AKARI_CODEC_BROWSER" audit-evidence/acceptance/audio-output-browser.json
      - name: Edit event headers and continuous roles through ordinary Block controls
        if: always()
        run: node audit/tests/structured-editing-browser.mjs "$AKARI_CODEC_BROWSER" audit-evidence/acceptance/structured-editing-browser.json
      - name: Require original composition acceptance, meaning and save roundtrip
        if: always()
        run: node audit/tests/composition-acceptance.mjs "$AKARI_CODEC_BROWSER" audit-evidence/acceptance/composition.json
      - name: Restore native editor history, drafts and quota failure atomically
        if: always()
        run: node audit/tests/workspace-history-browser.mjs "$AKARI_CODEC_BROWSER" audit-evidence/acceptance/workspace-history-browser.json
      - name: Verify visible data forms and runtime quantities
        if: always()
        run: node audit/tests/data-form-browser.mjs "$AKARI_CODEC_BROWSER" audit-evidence/acceptance/data-form-browser.json
      - name: Verify numeric displays, actual values and the offline player
        if: always()
        run: node audit/tests/numeric-display-browser.mjs "$AKARI_CODEC_BROWSER" audit-evidence/acceptance/numeric-display-browser.json
      - name: Protect referenced resources through native editing and undo
        if: always()
        run: node audit/tests/resource-references-browser.mjs "$AKARI_CODEC_BROWSER" audit-evidence/acceptance/resource-references-browser.json
      - name: Verify search focus, visible bindings and insertion
        if: always()
        run: node audit/tests/search-bindings-browser.mjs "$AKARI_CODEC_BROWSER" audit-evidence/acceptance/search-bindings-browser.json
      - name: Verify empty work, sample, speech placement and manual contrast
        if: always()
        run: node audit/tests/ux-surface-browser.mjs "$AKARI_CODEC_BROWSER" audit-evidence/acceptance/ux-surface-browser.json
      - name: Verify unchanged UX originals and timed speech semantics
        if: always()
        run: node audit/tests/ux-repair-language.mjs audit-evidence/acceptance/ux-repair-language.json
      - name: Verify UX repair controls in the fixed browser
        if: always()
        run: node audit/tests/ux-repair-browser.mjs "$AKARI_CODEC_BROWSER" audit-evidence/acceptance/ux-repair-browser.json
      - name: Verify simultaneous speech at 52 and 100 percent with both mascots
        if: always()
        run: node audit/tests/ux-bubble-layout.cjs "$AKARI_CODEC_BROWSER" audit-evidence/acceptance/ux-bubble-layout.json
      - name: Verify local editing recovery and additional natural forms
        if: always()
        run: |
          node audit/tests/ux-repair02-language.mjs audit-evidence/acceptance/ux-repair02-language.json
          node audit/tests/ux-repair02-browser.mjs "$AKARI_CODEC_BROWSER" audit-evidence/acceptance/ux-repair02-browser.json
      - name: Verify fixed 48 tasks, responsive editing and two-second concurrent speech
        if: always()
        run: node audit/run-ux-repair02-gui.mjs "$AKARI_CODEC_BROWSER" audit-evidence/acceptance
      - name: Verify trigger editing, speech identity and local list recovery
        if: always()
        run: node audit/run-ux-repair03-gui.mjs "$AKARI_CODEC_BROWSER" audit-evidence/acceptance
      - name: Verify autosave ownership, completion ordering and failure recovery
        if: always()
        run: node audit/tests/autosave-state-browser.mjs "$AKARI_CODEC_BROWSER" audit-evidence/acceptance/autosave-state-browser.json
      - name: Verify visible search controls, keyboard insertion and actual browser zoom
        if: always()
        run: node audit/tests/search-layout-browser.mjs "$AKARI_CODEC_BROWSER" audit-evidence/acceptance/search-layout-browser.json
      - name: Independently verify complete results including local recovery and speaker identity
        if: always()
        run: node audit/tests/actions-transfer-verify.mjs audit-evidence/acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akari-fixed-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-evidence/acceptance/
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true
  ux-repair05:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the approved fixed browser for repair 05
        run: |
          npm install --prefix "$RUNNER_TEMP/audit-deps" --no-package-lock --no-audit --no-fund playwright@1.55.0
          echo "NODE_PATH=$RUNNER_TEMP/audit-deps/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/audit-deps/node_modules/.bin/playwright" install-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python audit/install-codec-browser.py "$RUNNER_TEMP/repair05-browser"
          mkdir -p audit-evidence/repair05
      - name: Verify native insertion and preserved palette context
        if: always()
        run: node audit/tests/ux-insertion-context-browser.mjs "$AKARI_CODEC_BROWSER" audit-evidence/repair05/insertion-context.json
      - name: Independently verify insertion evidence and negative controls
        if: always()
        run: node audit/tests/ux-insertion-context-verify.mjs audit-evidence/repair05/insertion-context.json
      - name: Verify short speaker names, bounds and actual browser zoom
        if: always()
        run: node audit/tests/speech-name-layout-browser.mjs "$AKARI_CODEC_BROWSER" audit-evidence/repair05/speech-name-layout.json
      - name: Independently verify speaker evidence and negative controls
        if: always()
        run: node audit/tests/speech-name-layout-verify.mjs audit-evidence/repair05/speech-name-layout.json
      - name: Verify native simultaneous speech, restored previews and full-text entries
        if: always()
        run: node audit/tests/speech-preview-browser.mjs "$AKARI_CODEC_BROWSER" audit-evidence/repair05/speech-preview.json
      - name: Independently verify native preview evidence and negative controls
        if: always()
        run: node audit/tests/speech-preview-verify.mjs audit-evidence/repair05/speech-preview.json audit-evidence/repair05/speech-preview-verification.json
      - name: Verify visible reading support and concrete operation examples
        if: always()
        run: node audit/tests/child-language-ui-browser.mjs "$AKARI_CODEC_BROWSER" audit-evidence/repair05/child-language-ui.json
      - name: Independently verify language UI evidence and negative controls
        if: always()
        run: node audit/tests/child-language-ui-verify.mjs audit-evidence/repair05/child-language-ui.json
      - name: Verify component actions with native scrolling and browser zoom
        if: always()
        run: node audit/tests/component-controls-browser.mjs "$AKARI_CODEC_BROWSER" audit-evidence/repair05/component-controls.json
      - name: Independently verify component reachability and negative controls
        if: always()
        run: node audit/tests/component-controls-verify.mjs audit-evidence/repair05/component-controls.json audit-evidence/repair05/component-controls-verification.json
      - name: Verify child-facing diagnostics and reachable technical details
        if: always()
        run: node audit/tests/child-diagnostics-browser.mjs "$AKARI_CODEC_BROWSER" audit-evidence/repair05/child-diagnostics.json
      - name: Independently verify diagnostic evidence and negative controls
        if: always()
        run: node audit/tests/child-diagnostics-verify.mjs audit-evidence/repair05/child-diagnostics.json audit-evidence/repair05/child-diagnostics-verification.json
      - name: Reject incomplete or inconsistent diagnostic evidence
        if: always()
        run: node audit/tests/child-diagnostics-negative.mjs audit-evidence/repair05/child-diagnostics.json audit-evidence/repair05/child-diagnostics-negative.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akari-ux-repair05-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-evidence/repair05/
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true
