name: Akari fixed acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: akari-acceptance-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  AKARI_REQUESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  composition-acceptance:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the approved fixed browser in runner temporary storage
        run: |
          npm install --prefix "$RUNNER_TEMP/audit-deps" --no-package-lock --no-audit --no-fund playwright@1.55.0
          echo "NODE_PATH=$RUNNER_TEMP/audit-deps/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/audit-deps/node_modules/.bin/playwright" install-deps chromium
          python audit/install-codec-browser.py "$RUNNER_TEMP/acceptance-browser"
      - name: Run and validate the required composition suites
        run: node audit/run-acceptance.mjs composition
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akari-fixed-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-evidence/acceptance/
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true
  ux-editing:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the approved fixed browser in runner temporary storage
        run: |
          npm install --prefix "$RUNNER_TEMP/audit-deps" --no-package-lock --no-audit --no-fund playwright@1.55.0
          echo "NODE_PATH=$RUNNER_TEMP/audit-deps/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/audit-deps/node_modules/.bin/playwright" install-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python audit/install-codec-browser.py "$RUNNER_TEMP/editing-browser"
          mkdir -p audit-evidence/editing
      - name: Run and validate the required UX suites
        run: node audit/run-acceptance.mjs editing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akari-ux-editing-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-evidence/editing/
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true
  child-ux-aggregate:
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [composition-acceptance, ux-editing]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: akari-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-evidence/child-ux/downloaded
      - name: Preserve prior attempts and their original conclusions
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node audit/tests/child-ux.mjs history audit-evidence/child-ux/retry-history.json
      - name: Require complete current-attempt evidence and successful required jobs
        if: always()
        env:
          AKARI_CHILD_UX_NEEDS: ${{ toJSON(needs) }}
        run: node audit/tests/child-ux.mjs aggregate audit-evidence/child-ux/downloaded audit-evidence/child-ux/child-ux-aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akari-child-ux-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-evidence/child-ux/*.json
          if-no-files-found: error
          retention-days: 3
