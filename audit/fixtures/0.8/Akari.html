<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob:; media-src blob:; connect-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
<title>あかり 0.8</title>
<style>

  :root{
    --bg:#edf2f8;
    --panel:#f6f8fb;
    --panel2:#ffffff;
    --panel3:#e9eef6;
    --surface:#ffffff;
    --surface-2:#f8fbff;
    --dark:#1f2937;
    --muted:#5f6b7a;
    --line:#c7d2df;
    --line-strong:#a9b8ca;
    --hilite:#ffffff;
    --shadow:rgba(38,57,89,.14);
    --shadow-strong:rgba(27,39,58,.22);
    --title1:#315a96;
    --title2:#5076b6;
    --title3:#6f92cb;
    --accent:#2f6fd6;
    --accent-soft:#eaf2ff;
    --accent-strong:#1f56b4;
    --danger:#c43b3b;
    --success:#1d7d44;
    --code:#fbfcfe;
    --console:#1d2430;
    --console-fg:#eef3fb;
    --select:#2f6fd6;
    --radius-sm:7px;
    --radius:10px;
    --radius-lg:14px;
  }
  *{box-sizing:border-box}
  html,body{
    height:100%;margin:0;overflow:hidden;
    background:linear-gradient(180deg,#f6f9fd 0%,#e9eff7 100%);
    font-family:"Yu Gothic UI","Yu Gothic","Meiryo","Segoe UI",sans-serif;
    font-size:13px;color:var(--dark)
  }
  button,input,select,textarea{font:inherit}
  button,input,select,textarea{transition:background-color .14s ease,border-color .14s ease,box-shadow .14s ease,transform .1s ease}
  button{
    background:linear-gradient(180deg,#ffffff 0%,#edf3fb 100%);
    color:var(--dark);
    border:1px solid var(--line-strong);
    border-radius:var(--radius-sm);
    padding:0 10px;
    min-height:30px;
    box-shadow:0 1px 0 rgba(255,255,255,.75) inset,0 1px 2px rgba(23,35,52,.08)
  }
  button:hover{background:linear-gradient(180deg,#ffffff 0%,#e7f0ff 100%);border-color:#91aed7}
  button:active{transform:translateY(1px);background:linear-gradient(180deg,#dfe8f7 0%,#eff4fb 100%)}
  button:disabled{color:#8b95a5;background:#f1f4f8;border-color:#d3dae5;box-shadow:none}
  input,select,textarea{
    border:1px solid var(--line-strong);
    border-radius:var(--radius-sm);
    background:#fff;color:var(--dark);
    box-shadow:0 1px 0 rgba(255,255,255,.7) inset
  }
  input:focus,select:focus,textarea:focus,button:focus-visible{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(47,111,214,.16)
  }
  #app{height:100%;display:grid;grid-template-rows:36px 48px 1fr 28px}
  .titlebar{
    display:flex;align-items:center;padding:0 14px;color:#fff;font-weight:700;letter-spacing:.02em;
    background:linear-gradient(180deg,var(--title3) 0%,var(--title2) 44%,var(--title1) 100%);
    border-bottom:1px solid rgba(255,255,255,.25);
    box-shadow:0 1px 0 rgba(255,255,255,.24) inset,0 2px 10px rgba(34,54,89,.18);
    user-select:none
  }
  .titlebar .lamp{margin-right:9px;font-size:18px;filter:drop-shadow(0 1px 2px rgba(255,255,255,.55))}
  .menutool{
    background:linear-gradient(180deg,rgba(255,255,255,.95) 0%,rgba(241,246,252,.97) 100%);
    border-bottom:1px solid #c5d0df;
    display:flex;align-items:center;gap:6px;padding:8px 10px;
    box-shadow:0 1px 0 rgba(255,255,255,.85) inset
  }
  .menutool .sep{height:28px;border-left:1px solid #d3dce8;border-right:1px solid #fff;margin:0 4px}
  #runBtn{background:linear-gradient(180deg,#fff 0%,#e8f6eb 100%);border-color:#95c6a3}
  #runBtn:hover{background:linear-gradient(180deg,#fff 0%,#dff5e5 100%);border-color:#67af7d}
  #stopBtn{background:linear-gradient(180deg,#fff 0%,#fdecec 100%);border-color:#d4a0a0}
  #stopBtn:hover{background:linear-gradient(180deg,#fff 0%,#fbe2e2 100%);border-color:#c86f6f}
  #projectName{margin-left:auto;width:230px;height:32px;padding:4px 9px;background:#fff}
  .main{min-height:0;display:grid;grid-template-columns:170px 1fr 290px;grid-template-rows:minmax(320px,1fr) 270px;gap:10px;padding:10px}
  .window{
    min-width:0;min-height:0;background:linear-gradient(180deg,var(--panel2) 0%,var(--panel) 100%);
    border:1px solid #c4cfdd;border-radius:var(--radius-lg);display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 6px 18px var(--shadow)
  }
  .win-title{
    height:32px;flex:0 0 32px;
    background:linear-gradient(180deg,#f6faff 0%,#e3ebf6 100%);
    color:#314255;font-weight:700;display:flex;align-items:center;padding:0 12px;user-select:none;
    border-bottom:1px solid #d2dcea
  }
  .window.active>.win-title{
    background:linear-gradient(180deg,#eef5ff 0%,#dce9fb 100%);
    color:#1f3553
  }
  .toolbox{grid-row:1 / 3;grid-column:1}
  .tool-list{padding:10px;display:grid;grid-template-columns:1fr;gap:8px;overflow:auto;background:transparent}
  .tool{
    display:flex;align-items:center;gap:9px;text-align:left;cursor:grab;user-select:none;
    min-height:38px;padding:0 10px;
    background:linear-gradient(180deg,#ffffff 0%,#eef4fb 100%);
    border:1px solid #ccd7e5;border-radius:9px;
    box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 2px 5px rgba(21,32,48,.06)
  }
  .tool:hover{background:linear-gradient(180deg,#ffffff 0%,#e9f2ff 100%);border-color:#9eb8db}
  .tool .ico{
    width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    text-align:center;font-size:16px;color:#2b4f88;background:linear-gradient(180deg,#f9fbff 0%,#dfeaff 100%);
    border:1px solid #b9cce7;flex:0 0 26px
  }
  .designer{grid-column:2;grid-row:1}
  .designer-wrap{
    flex:1;overflow:auto;
    background:linear-gradient(180deg,#dfe7f2 0%,#d3deec 100%);
    padding:26px;position:relative
  }
  #formFrame{
    width:646px;margin:auto;border:1px solid #bccbe0;border-radius:12px;overflow:hidden;
    background:linear-gradient(180deg,#fefefe 0%,#edf2f9 100%);
    box-shadow:0 10px 24px rgba(29,47,74,.18),0 1px 0 rgba(255,255,255,.85) inset
  }
  .form-title{
    height:30px;background:linear-gradient(180deg,var(--title3) 0%,var(--title2) 48%,var(--title1) 100%);
    color:white;font-weight:700;display:flex;align-items:center;padding:0 10px;user-select:none
  }
  #formSurface{
    position:relative;width:640px;height:400px;overflow:hidden;background-color:#fff;
    background-image:radial-gradient(rgba(94,126,168,.24) 1px,transparent 1px);
    background-size:10px 10px;cursor:default
  }
  #penCanvas{position:absolute;inset:0;z-index:1;pointer-events:none}
  .component{position:absolute;z-index:2;user-select:none;transform-origin:center center}
  .component.design-selected::after{
    content:"";position:absolute;inset:-4px;border:2px solid rgba(47,111,214,.85);border-radius:8px;pointer-events:none
  }
  .component.design-selected::before{
    content:"";position:absolute;width:10px;height:10px;background:var(--accent);border:2px solid #fff;
    border-radius:999px;right:-8px;bottom:-8px;pointer-events:none;box-shadow:0 1px 4px rgba(31,86,180,.4)
  }
  .ak-label{display:flex;align-items:center;white-space:pre-wrap;overflow:hidden;padding:2px 4px}
  .ak-button{
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line-strong);border-radius:8px;
    background:linear-gradient(180deg,#ffffff 0%,#eaf1fb 100%);
    padding:2px 8px;cursor:pointer;
    box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 1px 3px rgba(24,36,54,.08)
  }
  .ak-button:active{transform:translateY(1px)}
  .ak-input{border:1px solid var(--line-strong);border-radius:8px;background:#fff;padding:3px 8px}
  .ak-box{border:1px solid #c5d2e2;border-radius:10px;background:linear-gradient(180deg,#fbfcfe 0%,#eef3f8 100%)}
  .ak-sprite{display:flex;align-items:center;justify-content:center;font-size:34px;cursor:pointer;background:transparent;line-height:1}
  .sprite-bubble{overflow-wrap:anywhere;max-height:160px;overflow:hidden;
    position:absolute;z-index:20;background:#fff;border:1px solid #b7c5d8;border-radius:12px;padding:6px 10px;
    min-width:40px;max-width:180px;pointer-events:none;box-shadow:0 8px 18px rgba(48,67,97,.18);white-space:pre-wrap
  }
  .side{grid-column:3;grid-row:1 / 3;display:grid;grid-template-rows:42% 58%;gap:10px;min-height:0}
  .tree,.props,.dialog-body{
    scrollbar-color:#bccbe0 #eef3f8;
  }
  .tree{
    padding:8px;overflow:auto;background:linear-gradient(180deg,#fff 0%,#f7fafe 100%);
    border-top:1px solid #eef3f9;flex:1
  }
  .tree-item{padding:6px 8px;cursor:default;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:8px;color:#334155}
  .tree-item:hover{background:#eef4fd}
  .tree-item.selected{background:linear-gradient(180deg,#4a83df 0%,#2f6fd6 100%);color:#fff;box-shadow:0 3px 10px rgba(47,111,214,.24)}
  .props{flex:1;overflow:auto;background:linear-gradient(180deg,#fff 0%,#f7fafe 100%)}
  .prop-row{display:grid;grid-template-columns:44% 56%;border-bottom:1px solid #e3eaf3;min-height:34px}
  .prop-name{padding:8px 10px;background:#f3f7fc;border-right:1px solid #e0e8f1;color:#536273}
  .prop-val{padding:5px 6px;background:rgba(255,255,255,.85)}
  .prop-val input,.prop-val select{width:100%;height:24px;border:1px solid #aabbd0}
  .codewin{grid-column:2;grid-row:2}
  .code-head{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 10px;background:linear-gradient(180deg,#f9fbfe 0%,#eef3fa 100%);border-bottom:1px solid #dce6f1}
  .code-head label{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:6px;color:#4b5c70;font-weight:600}
  #codeEditor{
    flex:1;width:100%;resize:none;border:none;border-top:1px solid rgba(255,255,255,.45);padding:12px 14px;background:var(--code);
    font-family:"BIZ UDゴシック","Consolas","MS Gothic",monospace;font-size:14px;line-height:1.6;tab-size:2;outline:none;color:#1d2a3a
  }
  .console{
    height:78px;flex:0 0 78px;background:linear-gradient(180deg,#212a38 0%,#161d28 100%);color:var(--console-fg);
    border-top:1px solid #4a5a74;padding:8px 10px;overflow:auto;font-family:Consolas,"BIZ UDゴシック","MS Gothic",monospace;font-size:12px;white-space:pre-wrap
  }
  .status{
    display:flex;align-items:center;padding:0 10px;border-top:1px solid rgba(255,255,255,.7);
    background:linear-gradient(180deg,#f8fbff 0%,#e8eef7 100%);font-size:12px;color:#4d5d72
  }
  .status .runstate{margin-left:auto}
  .run-on{color:var(--success);font-weight:700}
  .run-off{color:var(--danger);font-weight:700}
  #fileInput{display:none}
  .modal{position:fixed;inset:0;background:rgba(25,37,55,.32);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:1000}
  .modal.open,.modal.show{display:flex}
  .dialog{
    width:min(760px,92vw);height:min(620px,88vh);background:linear-gradient(180deg,var(--panel2) 0%,var(--panel) 100%);
    border:1px solid #c4cfdd;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 22px 48px rgba(24,37,58,.28)
  }
  .dialog-body{background:linear-gradient(180deg,#fff 0%,#f7fafe 100%);margin:0;padding:14px 16px;overflow:auto;line-height:1.7;flex:1}
  .dialog-body h2,.dialog-body h3{margin:.6em 0 .25em;color:#284468}
  .dialog-body code{font-family:"BIZ UDゴシック","Consolas","MS Gothic",monospace;background:#eef3fb;padding:1px 5px;border-radius:6px}
  .dialog-body pre{background:#f5f8fd;border:1px solid #d4deeb;border-radius:10px;padding:10px;overflow:auto}
  .dialog-foot{padding:10px 12px 12px;text-align:right;background:linear-gradient(180deg,#f7fafe 0%,#eef3f9 100%);border-top:1px solid #dde7f1}
  .runtime .component.design-selected::after,.runtime .component.design-selected::before{display:none}
  @media(max-width:900px){html,body{overflow:auto}#app{min-width:760px}}
  @media(max-height:850px){.main{grid-template-rows:minmax(240px,1fr) 320px}.console{height:56px;flex-basis:56px}.debugbar{height:34px;flex-basis:34px}.code-assist{min-height:30px}.designer-wrap{padding:18px}}

  .costume-img{width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none}
  .asset-target{padding:10px 12px;background:linear-gradient(180deg,#f9fbff 0%,#eef3f9 100%);border:1px solid #d8e1ed;border-radius:10px;margin-bottom:10px;color:#405166}
  .asset-toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;margin-bottom:12px}
  .asset-card{
    border:1px solid #c8d4e2;background:linear-gradient(180deg,#fff 0%,#eef3fa 100%);padding:8px;text-align:center;min-width:0;
    border-radius:12px;box-shadow:0 3px 9px rgba(30,47,72,.08)
  }
  .asset-card.active{outline:3px solid rgba(47,111,214,.26);border-color:#6f9ee0}
  .asset-card img,.asset-placeholder{width:86px;height:64px;object-fit:contain;background:#fff;border:1px solid #ccd7e4;border-radius:8px;margin:auto;display:flex;align-items:center;justify-content:center;font-size:32px}
  .asset-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:6px 0 4px;color:#3e4f65}
  .proc-grid{display:grid;grid-template-columns:190px 1fr;gap:10px;height:100%}
  .proc-list{display:flex;flex-direction:column;gap:8px}
  .proc-list select{width:100%;min-height:180px;padding:6px}
  .proc-edit{display:grid;grid-template-rows:auto auto 1fr;gap:8px;min-height:0}
  .proc-edit label{display:grid;grid-template-columns:86px 1fr;align-items:center;gap:6px;color:#4d5d72;font-weight:600}
  #procCode{width:100%;height:100%;min-height:280px;resize:none;font-family:"BIZ UDゴシック","Consolas","MS Gothic",monospace;font-size:14px;line-height:1.55;padding:10px;border:1px solid #afc0d4;background:#fbfcfe}
  .extension-row{display:flex;gap:10px;align-items:flex-start;padding:10px;border-bottom:1px solid #e1e8f1}
  .extension-row small{display:block;color:#5b6878;margin-top:2px;line-height:1.45}
  .help-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px}
  .help-cols pre{margin-top:4px}

  .ui-level-label{display:flex;align-items:center;gap:5px;color:#536273;font-weight:600;white-space:nowrap}
  #uiLevel{height:30px;min-width:76px;padding:0 6px}
  .side{grid-template-rows:minmax(0,30fr) minmax(0,42fr) minmax(0,28fr)}
  .monitor-window{min-height:120px}
  .runtime-monitor{flex:1;overflow:auto;padding:8px;background:linear-gradient(180deg,#fff 0%,#f7fafe 100%);font-size:12px}
  .monitor-empty{color:#718096;padding:6px;line-height:1.5}
  .monitor-section{margin-bottom:8px}
  .monitor-title{font-weight:700;color:#36516f;margin-bottom:3px}
  .monitor-row{display:grid;grid-template-columns:minmax(72px,42%) 1fr;gap:5px;padding:2px 4px;border-radius:5px}
  .monitor-row:nth-child(even){background:#f0f5fb}
  .monitor-key{color:#5c6d80;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .monitor-value{font-family:"BIZ UDゴシック","Consolas",monospace;overflow-wrap:anywhere}
  .debugbar{height:38px;flex:0 0 38px;display:flex;align-items:center;gap:6px;padding:4px 10px;background:linear-gradient(180deg,#f8fbff 0%,#edf3fa 100%);border-bottom:1px solid #d9e3ef}
  .debugbar button{min-height:28px;padding:0 9px}
  .exec-location{margin-left:auto;color:#536273;font-size:12px;white-space:nowrap}
  .editor-shell{position:relative;display:grid;grid-template-columns:46px 1fr;flex:1;min-height:80px;background:var(--code);overflow:hidden}
  .line-gutter{background:#eef3f9;border-right:1px solid #d5dfeb;padding-top:12px;overflow:hidden;user-select:none;color:#8190a3;text-align:right;font-family:"BIZ UDゴシック","Consolas",monospace;font-size:12px}
  .gutter-line{height:22px;line-height:22px;padding-right:9px;border-left:3px solid transparent}
  .gutter-line.active{background:#fff2bd;color:#705b00;border-left-color:#e6b800;font-weight:700}
  .gutter-line.error{background:#fdeaea;color:#a12828;border-left-color:#d94a4a;font-weight:700}
  .gutter-line.pair{background:#e6f0ff;color:#285aa4;border-left-color:#5b8edc}
  #codeEditor{min-height:0;height:100%;padding:12px 14px;line-height:22px;overflow:auto;white-space:pre;tab-size:2}
  .code-assist{min-height:34px;display:flex;align-items:center;gap:10px;padding:4px 10px;background:#f8fbff;border-top:1px solid #e0e8f2;border-bottom:1px solid #dce5f0;overflow:hidden}
  #codeIssue{flex:0 0 auto;max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#316944;font-size:12px}
  #codeIssue.issue-error{color:#b33131;font-weight:700}
  #codeIssue.issue-warning{color:#9a6a00;font-weight:700}
  .code-hints{display:flex;gap:5px;overflow-x:auto;flex:1;align-items:center}
  .hint-button{min-height:25px;padding:0 8px;font-size:12px;white-space:nowrap;background:#eef5ff;border-color:#b7c9e2}
  .save-state,.dirty-state{margin-left:14px;color:#67778a;font-size:12px}
  .dirty-state.dirty{color:#a56800;font-weight:700}
  .diagnosis-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}
  .diagnosis-card{padding:10px;border:1px solid #d6e0ec;border-radius:10px;background:#f7fafe;text-align:center}
  .diagnosis-card b{display:block;font-size:22px;color:#315a96}
  .diagnosis-issue{padding:8px 10px;margin:6px 0;border-radius:9px;border:1px solid #efd0d0;background:#fff5f5}
  .diagnosis-issue button{margin-top:5px;min-height:25px}
  .diagnosis-ok{padding:10px;border:1px solid #bfdec8;background:#f1fbf4;border-radius:9px;color:#27643a}
  .diagnosis-tags{display:flex;flex-wrap:wrap;gap:5px}
  .diagnosis-tag{padding:3px 7px;border-radius:999px;background:#eaf2ff;border:1px solid #c9daf2;color:#385b86;font-size:12px}
  body[data-ui-level="basic"] .main{grid-template-columns:170px 1fr}
  body[data-ui-level="basic"] .side{display:none}
  body[data-ui-level="basic"] #undoBtn,
  body[data-ui-level="basic"] #redoBtn,
  body[data-ui-level="basic"] #resetBtn,
    body[data-ui-level="basic"] #procBtn,
  body[data-ui-level="basic"] #dataBtn,
  body[data-ui-level="basic"] #diagnoseBtn{display:none}
  body[data-ui-level="basic"] .debugbar{display:none}
  body[data-ui-level="basic"] .menutool .sep{display:none}


  #app{grid-template-rows:36px auto minmax(620px,1fr) 28px;min-height:100%}
  html,body{overflow:auto}
  .menutool{flex-wrap:wrap;min-height:48px}
  .menutool button{flex-shrink:0}
  .component{touch-action:none}
  .component.ak-input{touch-action:auto}
</style>

.titlebar{min-height:38px;overflow-wrap:anywhere}
.main{grid-template-columns:145px minmax(0,1fr) 265px;grid-template-rows:minmax(330px,52vh) minmax(480px,auto)}
.designer-wrap{min-width:0;padding:12px;overflow:auto}
.stage-viewport{flex:none;position:relative;max-width:100%;overflow:hidden;margin:0 auto}

.status{min-height:30px;flex-wrap:wrap;gap:5px;padding:6px 10px;overflow-wrap:anywhere}

.side,.code-head label,.proc-edit,.proc-list,.proc-edit label{min-width:0}
.code-head{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
input,select,textarea{min-width:0;max-width:100%}
.debugbar{height:auto;flex-basis:auto;flex-wrap:wrap;min-height:38px}
.codewin{min-height:480px}.editor-shell{min-height:140px}
.dialog{max-width:96vw;max-height:94dvh}
.dialog-body{min-width:0}.dialog-foot{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:6px}

 .toolbox{grid-column:1;grid-row:1/3}.designer{grid-column:2;grid-row:1}.codewin{grid-column:2;grid-row:2}
 .side{grid-column:1/3;grid-row:3;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:320px}

<div id="app">
  <div class="titlebar"><span class="lamp">💡</span>あかり 0.8</div>
  <div class="menutool">
    <button id="newBtn">新規</button>
    <button id="openBtn">開く</button>
    <button id="saveBtn">保存</button>
    <button id="exportBtn">書き出し</button>
    <button id="undoBtn">↶ 元に戻す</button>
    <button id="redoBtn">↷ やり直す</button>
    <span class="sep"></span>
    <button id="runBtn">▶ 実行</button>
    <button id="stopBtn">■ 停止</button>
    <button id="resetBtn">最初に戻す</button>
    <span class="sep"></span>
    <button id="assetBtn">素材</button>
    <button id="procBtn">動作・求値</button>
    <button id="dataBtn">データ</button>
    <button id="diagnoseBtn">作品診断</button>
    <label class="ui-level-label">表示 <select id="uiLevel"><option value="basic">基本</option><option value="advanced" selected>発展</option><option value="all">全部</option></select></label>
    <input id="projectName" value="はじめてのあかり" aria-label="作品名" style="margin-left:auto;width:210px;height:26px;padding:2px 5px">
    <input id="fileInput" type="file" accept=".akari.md,.md,text/markdown,text/plain">
  </div>

  <div class="main">
    <section class="window active toolbox">
      <div class="win-title">道具箱</div>
      <div class="tool-list" id="toolList">
        <button class="tool" data-type="label" draggable="true"><span class="ico">Ａ</span>文字</button>
        <button class="tool" data-type="button" draggable="true"><span class="ico">▣</span>ボタン</button>
        <button class="tool" data-type="input" draggable="true"><span class="ico">▭</span>入力欄</button>
        <button class="tool" data-type="box" draggable="true"><span class="ico">□</span>四角</button>
        <button class="tool" data-type="sprite" draggable="true"><span class="ico">★</span>スプライト</button>
      </div>
    </section>

    <section class="window active designer" id="designerWindow">
      <div class="win-title">画面デザイナ</div>
      <div class="designer-wrap">
        <div id="formFrame">
          <div class="form-title" id="formTitle">はじめてのあかり</div>
          <div id="formSurface" tabindex="0" aria-label="実行画面">
            <canvas id="penCanvas" width="640" height="400"></canvas>
          </div>
        </div>
      </div>
    </section>

    <div class="side">
      <section class="window active">
        <div class="win-title">作品</div>
        <div class="tree" id="projectTree"></div>
      </section>
      <section class="window active">
        <div class="win-title">プロパティ</div>
        <div class="props" id="properties"></div>
      </section>
      <section class="window active monitor-window">
        <div class="win-title">実行モニター</div>
        <div class="runtime-monitor" id="runtimeMonitor"><div class="monitor-empty">停止中</div></div>
      </section>
    </div>

    <section class="window active codewin">
      <div class="win-title">コード</div>
      <div class="code-head">
        <label>対象 <select id="objectSelect"></select></label>
        <label>できごと <select id="eventSelect"></select></label>
      </div>
      <div class="debugbar">
        <button id="pauseBtn">⏸ 一時停止</button>
        <button id="continueBtn">▶ 続ける</button>
        <button id="stepBtn">1命令ずつ</button>
        <button id="formatBtn">コードを整える</button>
        <span class="exec-location" id="execLocation">実行位置：―</span>
      </div>
      <div class="editor-shell">
        <div class="line-gutter" id="lineGutter" aria-hidden="true"></div>
        <textarea id="codeEditor" spellcheck="false" aria-label="あかりのコード"></textarea>
      </div>
      <div class="code-assist"><span id="codeIssue">✓ 文法を確認中</span><div class="hint-panel"><div class="hint-controls"><input id="hintSearch" type="search" aria-label="候補を検索" placeholder="命令・値・名前を検索"><label><input id="hintUnavailable" type="checkbox">対象外も表示</label><button id="hintPrev">前</button><span id="hintCount"></span><button id="hintNext">次</button></div><div class="code-hints" id="codeHints"></div></div></div>
      <div class="console" id="console">あかり0.8を起動しました。</div>
    </section>
  </div>

  <div class="status"><span id="statusText">準備完了</span><span class="save-state" id="autosaveState">自動保存：待機</span><span class="dirty-state" id="dirtyState">変更なし</span><span class="runstate run-off" id="runState">停止中</span></div>
</div>

<div class="modal" id="assetModal" role="dialog" aria-modal="true" aria-label="素材">
  <div class="dialog">
    <div class="win-title">素材 — 背景・衣装・音</div>
    <div class="dialog-body">
      <div class="asset-toolbar">
        <button id="backdropImageAdd">背景画像を追加</button>
        <button id="costumeImageAdd">選択スプライトへ衣装画像を追加</button>
        <button id="soundAdd">音を追加</button>
        <span class="sep"></span>
        <input id="backdropName" placeholder="背景名" style="width:130px;padding:6px">
        <input id="backdropColor" value="#ffffff" placeholder="#RRGGBB" style="width:105px;padding:6px">
        <button id="backdropAdd">色背景</button>
        <input id="costumeName" placeholder="衣装名" style="width:120px;padding:6px">
        <input id="costumeText" value="★" placeholder="文字衣装" style="width:90px;padding:6px">
        <button id="costumeAdd">文字衣装</button>
      </div>
      <div id="assetProgress" class="asset-target" style="display:none"></div>
      <input id="imageBackdropInput" type="file" accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp" hidden>
      <input id="imageCostumeInput" type="file" accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp" hidden>
      <input id="soundInput" type="file" accept="audio/mpeg,audio/wav,.mp3,.wav" hidden>
      <div id="assetBody"></div>
    </div>
    <div class="dialog-foot"><button id="assetClose">閉じる</button></div>
  </div>
</div>

<div class="modal" id="procModal" role="dialog" aria-modal="true" aria-label="動作・求値">
  <div class="dialog">
    <div class="win-title">動作・求値</div>
    <div class="dialog-body">
      <div class="proc-grid">
        <div class="proc-list">
          <select id="callableSelect" size="12"></select>
          <button id="callableNewAction">新しい動作</button>
          <button id="callableNewFunction">新しい求値</button>
          <button id="callableDelete">削除</button>
        </div>
        <div class="proc-edit">
          <input id="callableEditingId" type="hidden">
          <label>種類 <select id="callableType"><option value="action">動作</option><option value="function">求値</option></select></label>
          <label>名前 <input id="callableName"></label>
          <label>引数 <input id="callableArgs"></label>
          <div id="callableHeader" class="asset-target">新しい動作</div>
          <textarea id="callableCode" spellcheck="false"></textarea>
          <div class="hint-panel"><div class="hint-controls"><input id="callableHintSearch" type="search" aria-label="動作・求値の候補を検索" placeholder="命令・値・名前を検索"><button id="callableHintPrev">前</button><span id="callableHintCount"></span><button id="callableHintNext">次</button></div><div class="code-hints" id="callableHints" aria-label="動作・求値のコード候補"></div></div>
        </div>
      </div>
    </div>
    <div class="dialog-foot"><button id="callableFormat">本文を整える</button> <button id="callableSave">保存</button> <button id="procClose">閉じる</button></div>
  </div>
</div>

<div class="modal" id="dataModal" role="dialog" aria-modal="true" aria-label="データ">
  <div class="dialog" style="height:min(620px,88vh)">
    <div class="win-title">データ — 作品変数・個体変数・リスト</div>
    <div class="dialog-body">
      <div class="asset-toolbar">
        <label>所属 <select id="dataScope"><option value="project">作品</option><option value="self">選択個体</option></select></label>
        <label>種類 <select id="dataKind"><option value="variable">変数</option><option value="list">リスト</option></select></label>
        <input id="dataName" placeholder="名前" style="width:150px;padding:6px">
        <input id="dataInitial" style="width:280px;padding:6px">
        <button id="dataAdd">作る</button>
      </div>
      <div id="dataBody"></div>
    </div>
    <div class="dialog-foot"><button id="dataClose">閉じる</button></div>
  </div>
</div>

<div class="modal" id="diagnosisModal" role="dialog" aria-modal="true" aria-label="作品診断">
  <div class="dialog" style="height:min(650px,88vh)">
    <div class="win-title">作品診断</div>
    <div class="dialog-body" id="diagnosisBody"></div>
    <div class="dialog-foot"><button id="diagnosisClose">閉じる</button></div>
  </div>
</div>

<div class="modal" id="recoveryModal" role="dialog" aria-modal="true" aria-label="自動保存から復元">
  <div class="dialog" style="width:min(560px,92vw);height:auto;max-height:80vh">
    <div class="win-title">自動保存された作品</div>
    <div class="dialog-body"><p id="recoveryText">前回の自動保存があります。</p></div>
    <div class="dialog-foot"><button id="recoveryDiscard">使わない</button> <button id="recoveryRestore">復元する</button></div>
  </div>
</div>


<div class="modal" id="questionModal" role="dialog" aria-modal="true" aria-label="あかりの質問">
  <div class="dialog">
    <div class="win-title">あかりからの質問</div>
    <div class="dialog-body"><div id="questionText"></div><input id="questionAnswer" autocomplete="off"></div>
    <div class="dialog-foot"><button id="questionStop">実行を停止</button> <button id="questionSubmit">答える</button></div>
  </div>
</div>
<div class="modal" id="failureModal" role="dialog" aria-modal="true" aria-label="失敗時の記録"><div class="dialog"><div class="win-title">失敗時の記録</div><div class="record-controls"><label for="failureSelect">記録</label><select id="failureSelect"></select></div><div class="dialog-body" id="failureBody"></div><div class="dialog-foot"><button id="failureClose">閉じる</button></div></div></div>
<div class="modal" id="valueModal" role="dialog" aria-modal="true" aria-label="値の全文"><div class="dialog"><div class="win-title" id="valueTitle">値の全文</div><div class="record-controls" id="valueListControls"><button id="valueItemPrev">前の要素</button><label for="valueItem">番号</label><input id="valueItem" type="number" min="1" step="1"><span id="valueCount"></span><button id="valueItemNext">次の要素</button></div><pre class="dialog-body value-output" id="valueOutput" tabindex="0"></pre><div class="dialog-foot"><button id="valuePagePrev">前のページ</button> <span id="valuePage"></span> <button id="valuePageNext">次のページ</button> <button id="valueClose">閉じる</button></div></div></div>
